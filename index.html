 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MontCode™ Rescue Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-black text-white flex flex-col items-center justify-center min-h-screen p-6 font-sans overflow-hidden">

    <button onclick="toggleLanguage()" class="absolute top-4 right-4 bg-zinc-800 px-3 py-1 rounded-full text-[10px] font-bold border border-zinc-700 z-[60] active:scale-95 transition-all">
        <span id="lang-label">ESP</span> 🇪🇸
    </button>

    <div id="setup-screen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-start p-8 text-center transition-opacity duration-500 overflow-y-auto hidden">
        <div class="w-20 h-20 mt-10 mb-6 bg-zinc-900 rounded-full flex items-center justify-center border-2 border-zinc-800 overflow-hidden">
            <img src="logo.png.jpg" alt="Logo" class="w-full h-full object-cover">
        </div>
        <h2 class="text-[#ccff00] font-black italic text-2xl mb-2 uppercase tracking-tighter" id="t-setup-title">Tactical Setup</h2>
        <p class="text-zinc-500 text-[10px] mb-8 tracking-[0.3em] uppercase italic" id="t-setup-sub">Establish your rescue profile</p>
        
        <div class="w-full max-w-xs bg-zinc-900/50 p-6 rounded-[2rem] border border-zinc-800 mb-8 text-left shadow-2xl">
            <label class="text-[#ccff00] text-[9px] font-black uppercase tracking-widest ml-2 mb-2 block" id="t-label-name">Patient Name</label>
            <input type="text" id="user-name-input" placeholder="Ex: Manuel Montalvan" 
                   class="w-full bg-black border border-zinc-800 p-4 rounded-2xl mb-6 text-white text-sm focus:border-[#ccff00] outline-none transition-all placeholder:opacity-30">
            
            <button onclick="saveProfile()" class="w-full bg-[#ccff00] text-black py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-[#ccff00]/10 active:scale-95 transition-all" id="t-btn-save">
                Save Profile
            </button>
        </div>
    </div>

    <div class="text-center mb-8 flex flex-col items-center">
        <div class="w-24 h-24 mb-6 bg-zinc-900 rounded-full flex items-center justify-center border-4 border-[#ccff00]/20 shadow-lg shadow-[#ccff00]/10 overflow-hidden">
            <img src="logo.png.jpg" alt="Logo" class="w-full h-full object-cover">
        </div>
        <h1 class="text-[#ccff00] text-3xl font-black italic tracking-tighter uppercase leading-none">RESCUE SEND</h1>
        
        <div class="mt-4 bg-zinc-900 px-6 py-3 rounded-2xl border border-zinc-800 shadow-inner">
            <p class="text-zinc-500 text-[8px] uppercase tracking-[0.2em] font-black mb-1" id="t-id-label">Your Private Rescue ID</p>
            <p id="device-display" class="text-[#ccff00] text-xl font-mono tracking-[0.2em] font-black"></p>
        </div>
    </div>

    <button id="main-trigger" onclick="triggerRescue()" class="w-72 h-72 bg-red-600 hover:bg-red-700 text-white font-black rounded-full border-[12px] border-red-900/30 shadow-[0_0_60px_rgba(220,38,38,0.4)] active:scale-90 transition-all flex flex-col items-center justify-center group relative overflow-hidden focus:outline-none">
        <span class="text-7xl italic uppercase leading-none tracking-tighter">SOS</span>
        <span id="sub-text" class="text-[10px] opacity-70 mt-3 uppercase tracking-[0.3em] font-black">Press for Help</span>
        <div class="absolute inset-0 bg-white/10 opacity-0 group-active:opacity-100 transition-opacity"></div>
    </button>

    <div id="status-box" class="mt-12 p-5 rounded-2xl bg-zinc-900/50 border border-zinc-800 w-full max-w-xs text-center shadow-2xl">
        <p id="status-text" class="text-zinc-600 font-bold text-[10px] uppercase tracking-[0.2em]">Ready to Transmit</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVIQ4S-w4Ag40uYuArW3o7Hw2XQwoQV7U",
            authDomain: "montcode-e02c7.firebaseapp.com",
            databaseURL: "https://montcode-e02c7-default-rtdb.firebaseio.com",
            projectId: "montcode-e02c7",
            storageBucket: "montcode-e02c7.firebasestorage.app",
            messagingSenderId: "988300151844",
            appId: "1:988300151844:web:b1a31275a9555de98a9cb1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- LÓGICA DE IDIOMA ---
        let isSpanish = false;
        window.toggleLanguage = () => {
            isSpanish = !isSpanish;
            document.getElementById('lang-label').innerText = isSpanish ? "ENG" : "ESP";
            document.getElementById('t-setup-title').innerText = isSpanish ? "Configuración Táctica" : "Tactical Setup";
            document.getElementById('t-setup-sub').innerText = isSpanish ? "Establezca su perfil de rescate" : "Establish your rescue profile";
            document.getElementById('t-label-name').innerText = isSpanish ? "Nombre del Paciente" : "Patient Name";
            document.getElementById('t-btn-save').innerText = isSpanish ? "Guardar Perfil" : "Save Profile";
            document.getElementById('t-id-label').innerText = isSpanish ? "Tu ID de Rescate Privado" : "Your Private Rescue ID";
            document.getElementById('sub-text').innerText = isSpanish ? "Presionar para Ayuda" : "Press for Help";
            document.getElementById('status-text').innerText = isSpanish ? "Listo para Transmitir" : "Ready to Transmit";
        };

        // --- GESTIÓN DE ID ---
        const patientID = localStorage.getItem('montcode_device_id') || 'MC-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        localStorage.setItem('montcode_device_id', patientID);
        document.getElementById('device-display').innerText = patientID;

        window.onload = () => {
            if (!localStorage.getItem('user_name')) {
                document.getElementById('setup-screen').classList.remove('hidden');
            }
        };

        window.saveProfile = () => {
            const name = document.getElementById('user-name-input').value;
            if (name) {
                localStorage.setItem('user_name', name);
                document.getElementById('setup-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('setup-screen').classList.add('hidden'), 500);
            }
        };

        // --- ACTIVACIÓN SOS ---
        window.triggerRescue = async () => {
            const status = document.getElementById('status-text');
            const pName = localStorage.getItem('user_name') || "Unknown Patient";
            
            if (navigator.vibrate) navigator.vibrate([300, 100, 300]);

            status.innerText = isSpanish ? "LOCALIZANDO GPS..." : "LOCATING GPS...";
            status.className = "text-yellow-400 font-bold text-[10px] animate-pulse uppercase tracking-[0.2em]";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const coords = `${pos.coords.latitude},${pos.coords.longitude}`;
                        sendToFirebase(coords, pName);
                    },
                    () => sendToFirebase("No GPS Data", pName),
                    { timeout: 8000, enableHighAccuracy: true }
                );
            } else {
                sendToFirebase("No GPS Data", pName);
            }
        };

        function sendToFirebase(coords, name) {
            const status = document.getElementById('status-text');
            const alertRef = ref(db, 'alerts/' + patientID);

            // Cumpliendo con las Reglas de Seguridad (hasChildren: patientName, location, status, timestamp)
            set(alertRef, {
                patientName: name,
                location: coords,
                timestamp: Date.now(),
                status: 'CRITICAL'
            }).then(() => {
                status.innerText = isSpanish ? "SEÑAL ENTREGADA ✅" : "SIGNAL DELIVERED ✅";
                status.className = "text-[#ccff00] font-black text-[10px] uppercase tracking-[0.2em]";
            }).catch((e) => {
                status.innerText = isSpanish ? "ERROR DE SEGURIDAD" : "SECURITY ERROR";
                status.className = "text-red-500 font-black text-[10px] uppercase tracking-[0.2em]";
                console.error(e);
            });
        }

        // Soporte de Teclas de Volumen / Media
        document.addEventListener('keydown', (e) => {
            const triggers = ['Enter', 'VolumeUp', 'MediaPlayPause', 'HeadsetHook'];
            if (triggers.includes(e.key)) {
                e.preventDefault();
                triggerRescue();
            }
        });
    </script>
</body>
</html>
